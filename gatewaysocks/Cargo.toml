[package]
name = "gatewaysocks"
version = "0.2.3"
authors = ["airtrack <airtrack.sk@gmail.com>"]
edition = "2024"
build = "build.rs"

[dependencies]
gateway = { path = "../gateway" }
socks5 = { git = "https://github.com/airtrack/sproxy.git", tag = "0.1.1" }
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5.60", features = ["derive"] }
futures = "0.3"
tokio = { version = "1.38.0", features = ["full"] }
axum = "0.8.4"
atomic-time = "0.1"
tabled = "0.20"
opentelemetry = "0.31.0"
opentelemetry_sdk = "0.31.0"
opentelemetry-otlp = "0.31.0"
shadow-rs = { version = "2.0.0", default-features = false }

[build-dependencies]
shadow-rs = "2.0.0"
